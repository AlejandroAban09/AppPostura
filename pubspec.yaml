name: focusme_app
description: "App Flutter para mejorar la concentración con ESP32"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1

  # Navegación
  go_router: ^16.0.0

  # UI y visuales
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  #flutter_vibrate: ^1.3.0
  flutter_local_notifications: ^17.1.0
  get_it: ^7.2.0



  # Estado y lógica
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # Bluetooth para ESP32
  flutter_blue_plus: ^1.35.5

  # Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio (para ruido blanco)
  audioplayers: ^5.2.1

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Fechas y formato
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_web_bluetooth: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    # - assets/audio/lofi.mp3
    # - assets/audio/Rain.mp3
    # - assets/audio/Waves.mp3
    # - assets/audio/alert.mp3
    - assets/imagenes/logo.png
    - assets/imagenes/ZenCat.jpg
    - assets/imagenes/Owlight.jpg
    - assets/imagenes/FocusBear.jpg

# Configuración de iconos de la app
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/imagenes/logo.png"
    background_color: "#F9F9F9"
    theme_color: "#64A5D3"
  windows:
    generate: true
    image_path: "assets/imagenes/logo.png"
  macos:
    generate: true
    image_path: "assets/imagenes/logo.png"
  image_path: "assets/imagenes/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#F9F9F9" # android adaptive icon background color
  adaptive_icon_foreground: "assets/imagenes/logo.png" # android adaptive icon foreground image
